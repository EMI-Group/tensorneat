name: CI

# Test gate for TensorNEAT (evoxc backend). The only other workflow,
# pypi_publish.yaml, is release-only: it builds and uploads a distribution on a
# GitHub release and runs no tests, so every check lives here.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege: CI clones the repo and reads it, nothing else.
permissions:
  contents: read

# A new push to the same ref cancels the run it supersedes, keeping the queue
# and the bill down.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The numpy test suites need no optional native toolchain and no secrets, so
# all jobs below are plain checkouts + uv.
jobs:
  # The gate. `numpy` is the reference interpreter backend and always
  # available, so this job is the verdict on correctness and determinism.
  test:
    name: test (numpy, Python 3.12, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux only: the suite is pure numpy (+ the frozen JAX oracle for
        # parity), so a second OS doubles CI cost for almost no new signal.
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Pins UV_PYTHON; the interpreter itself is installed below.
          python-version: "3.12"
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      # `bench` = jax + pytest: test/parity compares the evoxc kernels against
      # the frozen pre-rewrite JAX implementation in benchmarks/legacy_jax.
      # `--frozen` makes the committed uv.lock authoritative -- CI must never
      # silently rewrite (re-resolve) the lockfile, and a `pip`-style implicit
      # upgrade would invalidate the pre-rewrite performance contract.
      - name: Install dependencies
        run: uv sync --frozen --extra bench

      # unit + integration + backends (skipped: no iree extra) + the release
      # gate test/release_gate_no_jax.py, all on the numpy backend.
      - name: Test (numpy backend)
        run: uv run --frozen pytest

      # Reported as its own step so a legacy-oracle drift is obvious in the UI
      # instead of being buried in the full-suite summary.
      - name: Parity vs frozen legacy JAX oracle
        run: uv run --frozen pytest -m parity

  # Fast, self-documenting guard for the release constraint "import tensorneat
  # must not import jax/torch". test/release_gate_no_jax.py already asserts this
  # inside the gate above; this job keeps the failure mode legible on its own
  # (and catches it even if that file stops being collected).
  import-hygiene:
    name: import hygiene (no jax/torch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      # Base install only: jax must not even be present in the environment, so a
      # transitive import would be a genuine layering bug.
      - name: Install dependencies (no extras)
        run: uv sync --frozen

      - name: Import tensorneat and assert no JAX/torch module was pulled in
        run: |
          uv run --frozen python -c "import sys, tensorneat; bad = [m for m in ('jax', 'torch', 'brax', 'gymnax', 'mujoco') if m in sys.modules]; assert not bad, bad; print(tensorneat.__version__, 'clean')"

  # Optional compiled-backend leg. `iree` installs the ~80 MB iree-base-compiler
  # wheel and `iree-compile` costs ~9-11 s per static shape, so this job is NOT
  # part of the numpy verdict and the `test` job never depends on it;
  # `continue-on-error` keeps a heavy/flaky compile from masking a numpy
  # regression. Drop it (or promote the job) once the leg is stable in CI.
  # Without the extra, test/backends skips cleanly via the `requires_iree`
  # marker, so a bare numpy environment still passes the suite.
  iree:
    name: iree compiled backend (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (iree extra)
        run: uv sync --frozen --extra iree

      # test/backends: a tiny XOR pipeline (pop 8) really runs two generations on
      # the compiled llvm-cpu backend and is compared against the numpy run.
      - name: Test (iree llvm-cpu backend)
        run: uv run --frozen pytest -m requires_iree
