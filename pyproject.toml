[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tensorneat = ["*.txt", "*.json"]

[project]
name = "tensorneat"
version = "0.2.0"
authors = [{ name = "Lishuang Wang", email = "wanglishuang22@gmail.com" }]
description = "NEAT / HyperNEAT neuroevolution on the EvoX Compiler (evoxc)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The computation layer is evoxc (pure Python + numpy by default); jax/torch are
# NOT runtime dependencies. Compiled backends are opt-in extras.
#
# evoxc is pinned to an upstream `main` commit rather than to a PyPI release:
# PyPI only ships the 0.1.0 wheel, which predates the compiled-backend frontend
# work and the numpy-interpreter performance pass (per-block dispatch plans, a
# flat value store, dead-value release) that the library's CPU leg depends on.
# The pinned commit is the same code upstream `main` carries; the `>= 0.1.1`
# metadata floor keeps non-uv installers (plain `pip install tensorneat`) from
# silently resolving back to the slower 0.1.0 wheel.
dependencies = [
    "evoxc >= 0.1.1",
    "numpy >= 1.24",
    "networkx >= 3.3",
    "matplotlib >= 3.9.0",
    "sympy >= 1.12.1",
]

[project.optional-dependencies]
# IREE 3.13 is the first release whose ROCm/HIP runtime executes while/scan
# loops (3.10/3.11 abort in the HIP HAL on any loop-carried int32 `while` and
# SIGSEGV `iree-compile` on while-nested `cond`), so the extra names the IREE
# wheels directly instead of `evoxc[iree]`, whose pin is >=3.11,<3.12.
# Compiler and runtime must be the same release.
iree = ["iree-base-compiler>=3.13,<3.14", "iree-base-runtime>=3.13,<3.14"]
tvm = ["evoxc[tvm]"]
# The `xla` backend drives a PJRT C API plugin .so over ctypes (no `jax`
# import). For an AMD ROCm device the JAX ROCm PJRT plugin wheel provides one;
# evoxc discovers an installed `jax_plugins/*/*_plugin.so` automatically;
# `compile_options["plugin_path"]` names it explicitly when several are present.
# NVIDIA users install `jax-cuda12-pjrt` instead; no CPU PJRT plugin is
# pip-installable, so the CPU leg stays numpy / iree-llvm-cpu.
xla-rocm = ["jax-rocm7-pjrt==0.10.2"]
compilers = [
    "iree-base-compiler>=3.13,<3.14",
    "iree-base-runtime>=3.13,<3.14",
    "evoxc[tvm]",
]
# `bench` installs the frozen legacy JAX implementation, used as the timing
# baseline and numerical oracle by benchmarks/ and test/parity/.
bench = ["jax >= 0.4.28", "pytest >= 8.0"]
test = ["pytest >= 8.0"]
docs = ["sphinx >= 7.0", "sphinx-rtd-theme"]

[project.urls]
"Homepage" = "https://github.com/EMI-Group/tensorneat"
"Bug Tracker" = "https://github.com/EMI-Group/tensorneat/issues"

# uv-only resolution override: the runtime dependency above stays a normal
# version constraint, while uv resolves it from the v0.1.1 tag. This only
# affects uv (`uv lock` / `uv sync`); pip and other installers still see the
# plain `evoxc >= 0.1.1` requirement.
[tool.uv.sources]
evoxc = { git = "https://github.com/EMI-Group/evoxc", rev = "fe85a534192f749a97b2f6e3b13b0800f69b8d90" }

[dependency-groups]
# Developer tooling only; the test suite needs nothing beyond pytest. Optional
# runtime capabilities live in [project.optional-dependencies], not here.
dev = ["pytest >= 8.0"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"
markers = [
    "parity: compares against the frozen legacy JAX implementation (needs the `bench` extra)",
    "slow: takes more than a few seconds",
]
