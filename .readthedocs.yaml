# Read the Docs configuration (https://docs.readthedocs.io/en/stable/config-file/v2.html)
#
# The project floor is Python >= 3.11 (`.python-version` is 3.12) because evoxc
# requires it, so RTD must build on 3.12 -- the old `python: "3.10"` setting was
# below the floor.
#
# The install is uv-based, not pip-based: `evoxc` is a git dependency resolved by
# `[tool.uv.sources]` in pyproject.toml to the v0.1.1 tag, and its metadata still
# declares `version = "0.1.0"`, so a plain `pip install .` cannot satisfy
# `evoxc >= 0.1.1` (pip only sees the 0.1.0 wheel on PyPI).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "$READTHEDOCS_VIRTUALENV_PATH"
    install:
      # `uv sync` installs the project (editable) plus the `docs` extra into the
      # RTD virtualenv, which is what sphinx autodoc imports.
      - UV_PROJECT_ENVIRONMENT="$READTHEDOCS_VIRTUALENV_PATH" uv sync --extra docs
    build:
      html:
        - UV_PROJECT_ENVIRONMENT="$READTHEDOCS_VIRTUALENV_PATH" uv run --no-sync sphinx-build -T -b html docs "$READTHEDOCS_OUTPUT/html"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false
